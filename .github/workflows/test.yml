name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      # A fork's pull request gets a read-only token, so only same-repository pull requests get the comment.
      - name: Comment coverage on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bun -e '
            const rows = [];
            for await (const path of new Bun.Glob("packages/*/coverage/coverage-summary.json").scan()) {
              const { total } = await Bun.file(path).json();
              const cells = ["statements", "branches", "functions", "lines"].map(key => `${total[key].pct}%`);
              rows.push(`| ${path.split("/")[1]} | ${cells.join(" | ")} |`);
            }
            console.log(["## Coverage", "", "| Package | Statements | Branches | Functions | Lines |",
              "| --- | ---: | ---: | ---: | ---: |", ...rows.sort()].join("\n"));
          ' > "$RUNNER_TEMP/coverage.md"
          gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/coverage.md"
