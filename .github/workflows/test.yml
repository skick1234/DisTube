name: Test
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
jobs:
  test:
    name: Test on Node.js (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify release runtime
        run: bun run check:runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run complete release verification
        run: bun run verify

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
