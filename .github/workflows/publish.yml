name: Publish
# Tag a verified commit as `<package>@<version>` (for example `distube@6.0.0` or
# `@distube/discordjs@6.0.0`). CI verifies, packs that package and publishes it with provenance.
on:
  push:
    tags: ["*@*"]
jobs:
  publish:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.tag.outputs.directory }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm publish is the only publisher that supports --provenance (oven-sh/bun#15601).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(distube|@distube/(discordjs|oceanic|eris))@([0-9A-Za-z.+-]+)$ ]]; then
            echo "Tag must be <package>@<version>: $TAG" >&2
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[3]}"
          directory="packages/${name#@distube/}"
          manifest_name="$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).name)' "$directory/package.json")"
          manifest_version="$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$directory/package.json")"
          if [[ "$manifest_name" != "$name" || "$manifest_version" != "$version" ]]; then
            echo "Tag $TAG does not match $manifest_name@$manifest_version" >&2
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Pack
        working-directory: ${{ steps.tag.outputs.directory }}
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        working-directory: ${{ steps.tag.outputs.directory }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public

  docs:
    name: Publish documentation snapshot
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Checkout documentation site
        uses: actions/checkout@v4
        with:
          repository: distubejs/distubejs.github.io
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: site

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Snapshot
        env:
          DIRECTORY: ${{ needs.publish.outputs.directory }}
        run: |
          if [[ "$DIRECTORY" == "packages/distube" ]]; then
            bun site/scripts/snapshot.ts "$DIRECTORY" site/snapshots --docs docs
          else
            bun site/scripts/snapshot.ts "$DIRECTORY" site/snapshots
          fi

      - name: Commit and push
        working-directory: site
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add snapshots
          git commit -m "$TAG"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          git push
