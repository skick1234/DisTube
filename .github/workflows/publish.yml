name: Publish DisTube packages
on:
  release:
    types: [published]
jobs:
  publish:
    name: Validate, Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run complete release verification
        run: bun run verify

      - name: Publish independently versioned changed packages
        run: bun changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
