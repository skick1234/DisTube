name: Publish
# Tag a verified commit as `<package>@<version>` (for example `distube@6.0.0` or
# `@distube/discordjs@6.0.0`). CI verifies, packs that package and publishes it with provenance.
on:
  push:
    tags: ["*@*"]
jobs:
  publish:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm publish is the only publisher that supports --provenance (oven-sh/bun#15601).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(distube|@distube/(discordjs|oceanic|eris))@([0-9A-Za-z.+-]+)$ ]]; then
            echo "Tag must be <package>@<version>: $TAG" >&2
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[3]}"
          directory="packages/${name#@distube/}"
          manifest_name="$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).name)' "$directory/package.json")"
          manifest_version="$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$directory/package.json")"
          if [[ "$manifest_name" != "$name" || "$manifest_version" != "$version" ]]; then
            echo "Tag $TAG does not match $manifest_name@$manifest_version" >&2
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Pack
        working-directory: ${{ steps.tag.outputs.directory }}
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        working-directory: ${{ steps.tag.outputs.directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public
